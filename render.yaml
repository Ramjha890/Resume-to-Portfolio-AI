# Render Infrastructure as Code (Blueprint)
# Deploy at https://dashboard.render.com/blueprints

services:
  - type: web
    name: resume-to-portfolio-generator
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-postgres-db
          property: connectionString

databases:
  - name: portfolio-postgres-db
    region: oregon
    plan: free
    databaseName: portfolio_db
    user: portfolio_user
